<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texture Inspection Test Suite - Arena Hunt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
        h1 { color: #facc15; margin-bottom: 20px; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
        .section { margin-bottom: 32px; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 16px; font-size: 1.2rem; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .item { background: #090d16; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; width: 140px; }
        .item img, .item canvas { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; }
        .item label { font-size: 0.85rem; color: #cbd5e1; display: block; word-break: break-word; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1>🎨 Texture Inspection Test Suite</h1>

    <!-- 1. Player Hero Sprites -->
    <div class="section">
        <h2>Hero Character Sprites (Wang Lin)</h2>
        <div class="grid">
            <div class="item">
                <img src="/assets/images/wang_lin_v3.jpg" alt="Wang Lin Raw">
                <label>Raw High-Res</label>
            </div>
            <div class="item">
                <canvas id="heroNormalCanvas"></canvas>
                <label>Cut-Out Sharp</label>
            </div>
            <div class="item">
                <canvas id="heroRedCanvas"></canvas>
                <label>Zero-Box Red Tint</label>
            </div>
        </div>
    </div>

    <!-- 2. All 10 Enemy Models -->
    <div class="section">
        <h2>10 Enemy Models (Clean Cut-Outs)</h2>
        <div class="grid" id="enemyGrid"></div>
    </div>

    <!-- 3. 2D Weapon Skill Icons -->
    <div class="section">
        <h2>Weapon Skill Icons</h2>
        <div class="grid">
            <div class="item"><img src="/assets/images/sword_icon.jpg"><label>Spirit Swords</label></div>
            <div class="item"><img src="/assets/images/fireball_icon.jpg"><label>Arcane Fireball</label></div>
            <div class="item"><img src="/assets/images/thunder_icon.jpg"><label>Thunder Bolt</label></div>
            <div class="item"><img src="/assets/images/flame_ring_icon.jpg"><label>Flame Ring</label></div>
            <div class="item"><img src="/assets/images/boomerang_icon.jpg"><label>Boomerang</label></div>
            <div class="item"><img src="/assets/images/boots_speed_icon.jpg"><label>Boots of Speed</label></div>
            <div class="item"><img src="/assets/images/gem_magnet_icon.jpg"><label>Gem Magnet</label></div>
            <div class="item"><img src="/assets/images/vitality_elixir_icon.jpg"><label>Vitality Elixir</label></div>
        </div>
    </div>

    <!-- 4. Projectiles & Drops -->
    <div class="section">
        <h2>Projectiles & Drops</h2>
        <div class="grid">
            <div class="item"><img src="/assets/images/spider_web_proj.jpg"><label>Spider Web</label></div>
            <div class="item"><img src="/assets/images/goblin_arrow_proj.jpg"><label>Goblin Arrow</label></div>
            <div class="item"><img src="/assets/images/emerald_gem.jpg"><label>Emerald Gem</label></div>
            <div class="item"><img src="/assets/images/gold_coin.jpg"><label>Gold Coin</label></div>
        </div>
    </div>

    <script>
        // Process Hero Cutout & Red Tint
        const heroImg = new Image();
        heroImg.src = '/assets/images/wang_lin_v3.jpg';
        heroImg.onload = () => {
            const size = 128;
            const normC = document.getElementById('heroNormalCanvas');
            normC.width = size; normC.height = size;
            const ctx = normC.getContext('2d');
            ctx.drawImage(heroImg, 0, 0, size, size);
            
            const imgData = ctx.getImageData(0, 0, size, size);
            const data = imgData.data;
            const bgR = data[0], bgG = data[1], bgB = data[2];

            for (let i = 0; i < data.length; i += 4) {
                const diff = Math.max(Math.abs(data[i]-bgR), Math.max(Math.abs(data[i+1]-bgG), Math.abs(data[i+2]-bgB)));
                if (data[i] > 235 || diff < 26) data[i+3] = 0;
            }
            ctx.putImageData(imgData, 0, 0);

            // Red tint canvas
            const redC = document.getElementById('heroRedCanvas');
            redC.width = size; redC.height = size;
            const redCtx = redC.getContext('2d');
            redCtx.drawImage(normC, 0, 0);
            redCtx.globalCompositeOperation = 'source-in';
            redCtx.fillStyle = 'rgba(239, 68, 68, 0.9)';
            redCtx.fillRect(0, 0, size, size);
        };

        // Render Enemy Grid
        const enemies = [
            { name: 'Slime', src: '/assets/images/new_models/slime_enemy.png' },
            { name: 'Goblin Archer', src: '/assets/images/new_models/goblin_enemy.png' },
            { name: 'Ghost Demon', src: '/assets/images/new_models/ghost_enemy.png' },
            { name: 'Viper Serpent', src: '/assets/images/new_models/Viper Serpent.png' },
            { name: 'Orc Berserker', src: '/assets/images/new_models/Mutant Orc Berserker.png' },
            { name: 'Demon Fox', src: '/assets/images/new_models/fox_demon.png' },
            { name: 'Blood Cultist', src: '/assets/images/new_models/cultist_sorcerer.png' },
            { name: 'Stone Golem', src: '/assets/images/new_models/stone_golem.png' },
            { name: 'Spider Fiend', src: '/assets/images/new_models/spider_fiend.png' },
            { name: 'Frost Dragon', src: '/assets/images/new_models/frost_dragon.png' }
        ];

        const grid = document.getElementById('enemyGrid');
        enemies.forEach(e => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<img src="${e.src}" alt="${e.name}"><label>${e.name}</label>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
