<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texture Inspection Test Suite - Arena Hunt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
        h1 { color: #facc15; margin-bottom: 20px; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
        .section { margin-bottom: 32px; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 16px; font-size: 1.2rem; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .item { background: #090d16; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; width: 140px; }
        .item img, .item canvas { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; }
        .item label { font-size: 0.85rem; color: #cbd5e1; display: block; word-break: break-word; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1>🎨 Texture Inspection Test Suite</h1>

    <!-- 1. Player Hero Sprites -->
    <div class="section">
        <h2>Hero Character Sprites (Wang Lin)</h2>
        <div class="grid">
            <div class="item">
                <img src="/assets/images/heroes/wang_lin.png" alt="Wang Lin Clean">
                <label>Clean Transparent PNG</label>
            </div>
        </div>
    </div>

    <!-- 2. All 10 Enemy Models -->
    <div class="section">
        <h2>10 Enemy Models (Categorized PNGs)</h2>
        <div class="grid" id="enemyGrid"></div>
    </div>

    <!-- 3. 2D Weapon Skill Icons -->
    <div class="section">
        <h2>Weapon Skill Icons</h2>
        <div class="grid">
            <div class="item"><img src="/assets/images/powers/sword_icon.png"><label>Spirit Swords</label></div>
            <div class="item"><img src="/assets/images/powers/fireball_icon.png"><label>Arcane Fireball</label></div>
            <div class="item"><img src="/assets/images/powers/thunder_icon.png"><label>Thunder Bolt</label></div>
            <div class="item"><img src="/assets/images/powers/flame_ring_icon.png"><label>Flame Ring</label></div>
            <div class="item"><img src="/assets/images/powers/boomerang_icon.png"><label>Boomerang</label></div>
            <div class="item"><img src="/assets/images/powers/boots_speed_icon.png"><label>Boots of Speed</label></div>
            <div class="item"><img src="/assets/images/powers/gem_magnet_icon.png"><label>Gem Magnet</label></div>
            <div class="item"><img src="/assets/images/powers/vitality_elixir_icon.png"><label>Vitality Elixir</label></div>
        </div>
    </div>

    <!-- 4. Projectiles & Drops -->
    <div class="section">
        <h2>Projectiles & Drops</h2>
        <div class="grid">
            <div class="item"><img src="/assets/images/projectiles/spider_web.png"><label>Spider Web</label></div>
            <div class="item"><img src="/assets/images/projectiles/goblin_arrow.png"><label>Goblin Arrow</label></div>
            <div class="item"><img src="/assets/images/projectiles/emerald_gem.png"><label>Emerald Gem</label></div>
            <div class="item"><img src="/assets/images/projectiles/gold_coin.png"><label>Gold Coin</label></div>
        </div>
    </div>

    <script>
        const enemies = [
            { name: 'Slime', src: '/assets/images/enemies/slime.png' },
            { name: 'Goblin Archer', src: '/assets/images/enemies/goblin.png' },
            { name: 'Ghost Demon', src: '/assets/images/enemies/ghost.png' },
            { name: 'Viper Serpent', src: '/assets/images/enemies/snake.png' },
            { name: 'Orc Berserker', src: '/assets/images/enemies/bear.png' },
            { name: 'Demon Fox', src: '/assets/images/enemies/fox_demon.png' },
            { name: 'Blood Cultist', src: '/assets/images/enemies/cultist.png' },
            { name: 'Stone Golem', src: '/assets/images/enemies/stone_golem.png' },
            { name: 'Spider Fiend', src: '/assets/images/enemies/spider_fiend.png' },
            { name: 'Frost Dragon', src: '/assets/images/enemies/frost_dragon.png' }
        ];

        const grid = document.getElementById('enemyGrid');
        enemies.forEach(e => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<img src="${e.src}" alt="${e.name}"><label>${e.name}</label>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
